# mdq-mesh default configuration (PRD §11). Everything tunable lives here.
# No secrets, no keys — by design (C-1).

runtime:
  transport: asyncio          # asyncio | redpanda  (redpanda requires Docker — C-3 optional)
  redpanda:                   # Phase 8: optional Redpanda/Kafka transport
    bootstrap_servers: "localhost:9092"
    topic_prefix: "mdq"
    consumer_group: "mdq-mesh"
  parallelism: 4
  storage:
    bronze: data/bronze
    silver: data/silver
    gold: data/gold
    quarantine: data/quarantine
    lineage: data/lineage
  duckdb_path: data/mdq.duckdb

sources:
  yfinance:
    enabled: true
    retries: 3
    backoff_seconds: 2
    staleness_max_days: 1
  stooq:
    enabled: true
    retries: 3
    backoff_seconds: 2
    staleness_max_days: 1
  ecb:
    enabled: true             # Phase 7: ECB SDMX FX reference rates (keyless — C-1)
    retries: 3
    backoff_seconds: 2
  sec_edgar:
    enabled: true             # Phase 7: SEC EDGAR shares outstanding (keyless — C-1)
    retries: 2
    backoff_seconds: 3
    user_agent: "mdq-mesh research contact@example.com"   # required by SEC fair-access; NOT a key

reconciliation:
  quorum:
    min_agreeing_sources: 2
  tolerances:                 # per-field agreement bands
    CLOSE:     { type: relative_bps, value: 25 }
    OPEN:      { type: relative_bps, value: 25 }
    HIGH:      { type: relative_bps, value: 25 }
    LOW:       { type: relative_bps, value: 25 }
    ADJ_CLOSE: { type: relative_bps, value: 50 }
    VOLUME:    { type: relative_pct, value: 5 }
  on_no_quorum: break         # break -> quarantine -> remediation

dq_rules:
  null_check:        { enabled: true,  severity: high }
  range_check:       { enabled: true,  severity: high, min: 0 }
  staleness_check:   { enabled: true,  severity: high }
  monotonicity_check: { enabled: true, severity: medium }    # HIGH>=LOW etc.
  duplicate_check:   { enabled: true,  severity: medium }

corporate_actions:
  split_ratio_tolerance: 0.05     # how close a jump must be to a clean ratio (2:1, 3:1, 3:2...)
  dividend_drop_min_pct: 0.5
  require_cross_source_corroboration: true
  candidate_split_ratios: [2.0, 3.0, 1.5, 4.0]
  ca_window_days: 30

anomaly:
  zscore_window: 20
  zscore_threshold: 4.0
  iqr_multiplier: 1.5
  volatility_aware: true          # don't quarantine real volatility-regime moves
  volatility_regime_window: 5     # days for "recent" vol computation
  volatility_regime_ratio: 2.0    # recent_std / long_std ratio to flag a regime

remediation:
  max_retries: 3
  lookback_widen_steps: [5, 20, 60]   # days, escalating
  hold_downstream_on_break: true
  escalate_after_retries: true

narrator:
  enabled: false                  # optional, edge-only (C-6). Off by default.
  host: "http://localhost:11434"
  model: "llama3.1:8b"

scorecard:
  output_formats: [json, html]
