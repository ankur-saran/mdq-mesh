[project]
name = "mdq-mesh"
version = "0.1.0"
description = "Self-Healing Market-Data Quality & Reconciliation Mesh — local, keyless multi-agent system"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.6",
    "pandera>=0.18",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "duckdb>=0.10",
    "pyyaml>=6.0",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "jinja2>=3.1",
    "httpx>=0.27",
    # Keyless data sources
    "yfinance>=0.2.40",
    "pandas-datareader>=0.10",   # Stooq access
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
]
# Optional statistical helper (anomaly detection still works without it)
ml = ["scikit-learn>=1.4"]
# Optional local LLM narration (edge-only; system runs identically without it)
narrator = ["ollama>=0.2"]

[project.scripts]
mdq = "mdq.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdq"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
